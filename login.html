<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina-formulario">
        <div class="formulario">
            <div class="icone">🔐</div>
            <h1>Bem-vindo!</h1>
            <p>Entre na sua conta para acessar a agenda.</p>

            <form onsubmit="fazerLogin(event)">
                <label for="loginUsuario">E-mail</label>
                <input type="email" id="loginUsuario" placeholder="Digite seu e-mail" autocomplete="email" required>

                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha" autocomplete="current-password" required>

                <p id="mensagem" class="mensagem" role="alert"></p>
                <button type="submit" class="botao">Entrar</button>
            </form>

            <p class="link-formulario">
                Ainda não tem uma conta? <a href="cadastro.html">Criar conta</a>
            </p>
            <a href="index.html" class="voltar">← Voltar</a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
